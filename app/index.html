<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrobble Relay</title>
  <style>
    :root {
      --bg:#f7f6f2; --surface:#fbfbf9; --surface2:#f3f0ec; --border:#d4d1ca; --text:#28251d; --muted:#7a7974;
      --primary:#01696f; --primary2:#0c4e54; --ok:#437a22; --okbg:#dfe9d8; --bad:#964219; --badbg:#ead7cf;
      --radius:18px; --shadow:0 12px 32px rgba(40,37,29,.12);
    }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:760px;margin:auto;padding:14px}
    .hero{padding:8px 0 12px}
    h1{margin:0;font-size:clamp(28px,8vw,46px)} h2{margin:0 0 10px 0;font-size:18px}
    p{color:var(--muted);line-height:1.5;margin:6px 0 0}
    .panel,.result,.selected,.status-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
    .panel{padding:14px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.collapse-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:transparent;color:var(--text);padding:0;min-height:44px}.collapse-toggle .caret{font-size:16px;color:var(--muted);transition:transform .2s ease}.collapse-toggle[aria-expanded="false"] .caret{transform:rotate(-90deg)}.panel.is-collapsed #resultsWrap{display:none}.panel.is-collapsed{padding-bottom:10px;border-style:dashed}.panel.is-collapsed .collapse-toggle{opacity:.9}.panel.is-collapsible{cursor:pointer}.episode-section{padding:14px}.episode-section .collapse-toggle{color:var(--text)}.episode-section .episode-body{display:grid;gap:12px;padding-top:12px}.episode-section.is-collapsed .episode-body{display:none}.episode-section .episode-header{display:grid;gap:4px}.episode-section .episode-header-title{font-size:18px;font-weight:700}.episode-section .episode-header-sub{color:var(--muted)}
    .stack{display:grid;gap:14px}
    .search{display:grid;grid-template-columns:1fr 110px 110px auto;gap:10px}
    input,select,button{font:inherit}
    input,select{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:white;min-height:46px}
    button{padding:14px 16px;border:0;border-radius:14px;background:var(--primary);color:#000000;min-height:46px}
    button.alt{background:var(--surface2);color:var(--text)}
    button.send{padding:14px 16px;border:0;border-radius:14px;background:var(--primary);color:#fff;min-height:46px}
    .results{display:grid;gap:10px;max-height:470px;overflow-y:auto;padding-right:4px}
    .result{display:flex;gap:12px;padding:12px;cursor:pointer;align-items:center}
    .poster,.selected-poster{background:#d8d2c7;border-radius:12px;object-fit:cover;flex:0 0 auto}
    .poster{width:58px;height:87px}.selected-poster{width:96px;height:144px}
    .meta{flex:1;min-width:0}.meta strong{display:block;font-size:16px;line-height:1.25}.meta small{color:var(--muted)}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{background:var(--surface2);border-radius:999px;padding:6px 10px;font-size:12px}
    .selected{padding:14px;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}
    .facts{display:grid;gap:8px}.fact{display:flex;gap:8px;flex-wrap:wrap}.fact-label{color:var(--muted);min-width:62px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.picker-grid{display:grid;gap:10px}.picker-row{display:grid;gap:10px;grid-template-columns:1fr 1fr}.season-card,.episode-card{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px;cursor:pointer}.season-card.active,.episode-card.active{outline:2px solid var(--primary);outline-offset:0}.picker-title{font-weight:700}.muted{color:var(--muted)}
    .status-list{display:grid;gap:10px}
    .status-item{padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
    .status-left{display:grid;gap:4px;min-width:0}.status-url{font-size:14px;word-break:break-all}.status-meta{font-size:12px;color:var(--muted)}
    .badge{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
    .ok{background:var(--okbg);color:var(--ok)} .bad{background:var(--badbg);color:var(--bad)}
    .timeout{background:#f2dfc9;color:#9a5b00}
    .placeholder{color:var(--muted)}
    @media (max-width:700px){.search{grid-template-columns:1fr 1fr}.search input:first-child{grid-column:1/-1}.search button{grid-column:1/-1}.selected{grid-template-columns:72px 1fr}.selected-poster{width:72px;height:108px}}
  </style>
</head>
<body>
  <main class="wrap stack">
    <section class="hero">
      <h1>Scrobble Relay</h1>
      <p>Search on TMDb, pick the correct title, then send it to your internal webhook containers.</p>
    </section>

    <section class="panel stack">
      <div class="search">
        <input id="q" placeholder="Movie title or show title" value="">
        <input id="year" placeholder="Year" value="">
        <select id="type"><option value="movie">Movie</option><option value="tv">TV Show</option></select>
        <button id="searchBtn" class="send">Search</button>
      </div>
    </section>

    <section id="matchesPanel" class="panel stack is-collapsible">
      <button id="matchesToggle" class="collapse-toggle" type="button" aria-expanded="true" aria-controls="resultsWrap">
        <span class="section-head"><span><div style="margin:0;font-size:18px;font-weight:700">Matches</div><p id="searchStatus">Ready.</p></span></span>
        <span class="caret" aria-hidden="true">▾</span>
      </button>
      <div id="resultsWrap" class="stack">
        <div class="results" id="results"></div>
        <p id="resultsHint" class="placeholder" style="display:none;margin:0">Scroll for more results.</p>
      </div>
    </section>

    <section class="panel stack">
      <div>
        <h2>Selection</h2>
        <p id="payloadStatus">Pick a movie or show to see the clean summary.</p>
      </div>
      <div id="selectionArea" class="placeholder">Nothing selected yet.</div>
      <div id="episodeSection" class="panel stack episode-section is-collapsible" style="display:none">
        <button id="episodeToggle" class="collapse-toggle" type="button" aria-expanded="true" aria-controls="episodePickerWrap">
          <span class="episode-header">
            <span class="episode-header-title">TV Show</span>
            <span id="episodeStatus" class="episode-header-sub">Choose a season and episode.</span>
          </span>
          <span class="caret" aria-hidden="true">▾</span>
        </button>
        <div id="episodePickerWrap" class="episode-body">
          <div id="episodePicker" class="stack"></div>
        </div>
      </div>
      <div class="actions">
        <button id="sendBtn" class="send">Send to webhooks</button>
        <button id="copyBtn" class="alt">Copy JSON</button>
      </div>
    </section>

    <section class="panel stack">
      <div>
        <h2>Send status</h2>
        <p id="sendStatus">No request sent yet.</p>
      </div>
      <div id="statusList" class="status-list"></div>
    </section>
  </main>
<script>
const $ = s => document.querySelector(s);
let selectedId = null;
let lastPayload = null;
let lastMode = 'movie';
let episodeChoice = null; let seasonList = []; let episodeList = []; let matchesCollapsed = false; let episodeCollapsed = false;

function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function setMatchesCollapsed(collapsed){
  matchesCollapsed = !!collapsed;
  const panel = $('#matchesPanel');
  const toggle = $('#matchesToggle');
  panel.classList.toggle('is-collapsed', matchesCollapsed);
  toggle.setAttribute('aria-expanded', String(!matchesCollapsed));
}

function setEpisodeCollapsed(collapsed){
  episodeCollapsed = !!collapsed;
  const panel = $('#episodeSection');
  const toggle = $('#episodeToggle');
  panel.classList.toggle('is-collapsed', episodeCollapsed);
  toggle.setAttribute('aria-expanded', String(!episodeCollapsed));
}

function renderResults(results){
  $('#results').innerHTML = results.map(r => `
    <article class="result" data-id="${r.id}" data-title="${escapeHtml(r.title)}">
      ${r.poster ? `<img class="poster" src="${r.poster}" alt="">` : `<div class="poster"></div>`}
      <div class="meta">
        <strong>${escapeHtml(r.title)}</strong>
        <small>${escapeHtml(r.year || 'Unknown year')} · ${escapeHtml(r.type)}</small>
        <div class="chips"><span class="chip">TMDb ${r.id}</span>${r.originalTitle && r.originalTitle !== r.title ? `<span class="chip">${escapeHtml(r.originalTitle)}</span>` : ''}</div>
      </div>
    </article>
  `).join('');
  $('#resultsHint').style.display = results.length > 4 ? 'block' : 'none';
}

function directorFromPayload(payload){
  return payload?.Metadata?.Director?.[0]?.tag || payload?.Metadata?.Writer?.[0]?.tag || 'Unknown';
}

function titleFromPayload(payload){
  if(payload?.Metadata?.type === 'episode') return `${payload.Metadata.grandparentTitle} — S${String(payload.Metadata.parentIndex).padStart(2,'0')}E${String(payload.Metadata.index).padStart(2,'0')} · ${payload.Metadata.title}`;
  return payload?.Metadata?.title || 'Unknown title';
}

function yearFromPayload(payload){
  return payload?.Metadata?.year || payload?.Metadata?.originallyAvailableAt?.slice?.(0,4) || '—';
}

function posterFromPayload(payload){
  return payload?.poster || null;
}

function renderEpisodePicker(){
  const box = $('#episodePicker');
  if(lastMode !== 'tv' || !selectedId){ box.style.display='none'; box.innerHTML=''; $('#episodeSection').style.display='none'; return; }
  $('#episodeSection').style.display='grid'; box.style.display='grid';
  box.innerHTML = `
    <div>
      <h2>Episode picker</h2>
      <p class="muted">Choose the season and episode directly in the page.</p>
    </div>
    <div class="picker-row">
      <div id="seasonList" class="picker-grid"></div>
      <div id="episodeList" class="picker-grid"></div>
    </div>
  `;
  const seasonEl = $('#seasonList');
  const episodeEl = $('#episodeList');
  seasonEl.innerHTML = seasonList.map(s => `<button type="button" class="season-card ${episodeChoice && Number(episodeChoice.season)===Number(s.seasonNumber) ? 'active':''}" data-season="${s.seasonNumber}"><div class="picker-title">Season ${s.seasonNumber}</div><div class="muted">${escapeHtml(s.name || '')}</div><div class="muted">${s.episodeCount || 0} episode(s)</div></button>`).join('');
  episodeEl.innerHTML = episodeList.length ? episodeList.map(ep => `<button type="button" class="episode-card ${episodeChoice && Number(episodeChoice.episode)===Number(ep.episodeNumber) ? 'active':''}" data-episode="${ep.episodeNumber}"><div class="picker-title">E${String(ep.episodeNumber).padStart(2,'0')} · ${escapeHtml(ep.name || 'Episode')}</div><div class="muted">${escapeHtml(ep.airDate || '')}</div></button>`).join('') : '<div class="placeholder">Pick a season first.</div>';
  seasonEl.onclick = async e => { const btn = e.target.closest('[data-season]'); if(!btn) return; await loadEpisodes(btn.dataset.season); };
  episodeEl.onclick = async e => { const btn = e.target.closest('[data-episode]'); if(!btn) return; episodeChoice = { season: episodeChoice?.season, episode: btn.dataset.episode }; renderEpisodePicker(); if(selectedId && episodeChoice?.season && episodeChoice?.episode) await buildEpisodePayloadFromChoice(); };
}

async function loadSeasons(showId){
  const r = await fetch(`/api/tv/${showId}/seasons`);
  const data = await r.json();
  if(!r.ok){ $('#payloadStatus').textContent = data.error || 'Failed to load seasons'; return; }
  seasonList = data.seasons || [];
  episodeList = [];
  episodeChoice = null;
  renderEpisodePicker();
}

async function loadEpisodes(season){
  episodeChoice = { season: Number(season), episode: null };
  const r = await fetch(`/api/tv/${selectedId}/season/${season}/episodes`);
  const data = await r.json();
  if(!r.ok){ $('#payloadStatus').textContent = data.error || 'Failed to load episodes'; return; }
  episodeList = data.episodes || [];
  renderEpisodePicker();
  if(episodeList.length === 0) setEpisodeCollapsed(false);
}

async function buildEpisodePayloadFromChoice(){
  if(!episodeChoice?.season || !episodeChoice?.episode) return;
  $('#payloadStatus').textContent = 'Loading episode details…';
  const r = await fetch(`/api/payload/episode?showId=${encodeURIComponent(selectedId)}&season=${encodeURIComponent(episodeChoice.season)}&episode=${encodeURIComponent(episodeChoice.episode)}`);
  const data = await r.json();
  if(!r.ok){ $('#payloadStatus').textContent = data.error || 'Payload build failed'; return; }
  lastPayload = data;
  renderSelection(data);
  $('#payloadStatus').textContent = 'Ready to send.';
  if(episodeChoice?.season && episodeChoice?.episode) setEpisodeCollapsed(true);
}

function renderSelection(payload){
  const title = titleFromPayload(payload);
  const year = yearFromPayload(payload);
  const director = directorFromPayload(payload);
  const type = payload?.Metadata?.type || 'unknown';
  const poster = posterFromPayload(payload);
  const ids = (payload?.Metadata?.Guid || []).map(x => x.id.replace('://', ' '));
  $('#selectionArea').innerHTML = `
    <article class="selected">
      ${poster ? `<img class="selected-poster" src="${poster}" alt="">` : `<div class="selected-poster"></div>`}
      <div class="facts">
        <div><strong style="font-size:20px;line-height:1.2">${escapeHtml(title)}</strong></div>
        <div class="fact"><span class="fact-label">Year</span><span>${escapeHtml(year)}</span></div>
        <div class="fact"><span class="fact-label">Director</span><span>${escapeHtml(director)}</span></div>
        <div class="fact"><span class="fact-label">Type</span><span>${escapeHtml(type)}</span></div>
        <div class="chips">${ids.map(id => `<span class="chip">${escapeHtml(id)}</span>`).join('')}</div>
      </div>
    </article>
  `;
}

function renderStatuses(items){
  $('#statusList').innerHTML = (items || []).map(x => {
    const label = x.ok ? 'Sent' : (x.status === 'timeout' ? 'Timeout' : 'Failed');
    const cls = x.ok ? 'ok' : (x.status === 'timeout' ? 'timeout' : 'bad');
    const meta = x.ok
      ? `HTTP ${x.status}`
      : (x.status === 'timeout' ? 'Timed out after 500ms' : (x.error || 'No details'));

    return `
      <div class="status-item">
        <div class="status-left">
          <div class="status-url">${escapeHtml(x.url)}</div>
          <div class="status-meta">${escapeHtml(meta)}</div>
        </div>
        <span class="badge ${cls}">${label}</span>
      </div>
    `;
  }).join('');
}

async function search(){
  const q = $('#q').value.trim();
  const type = $('#type').value;
  const year = $('#year').value.trim();
  if(!q) return;
  setMatchesCollapsed(false);
  $('#searchStatus').textContent = 'Searching…';
  $('#results').innerHTML = '';
  const url = `/api/search?q=${encodeURIComponent(q)}&type=${encodeURIComponent(type)}&year=${encodeURIComponent(year)}`;
  const r = await fetch(url);
  const data = await r.json();
  if(!r.ok){ $('#searchStatus').textContent = data.error || 'Search failed'; return; }
  renderResults(data.results || []);
  $('#searchStatus').textContent = `${(data.results || []).length} result(s). Tap one.`;
}

async function buildPayload(id){
  selectedId = id;
  lastMode = $('#type').value;
  $('#payloadStatus').textContent = 'Loading details…';
  let r, data;
  if (lastMode === 'movie') {
    $('#episodeSection').style.display = 'none';
    $('#episodePicker').innerHTML = '';
    r = await fetch(`/api/payload/movie/${id}`);
    data = await r.json();
    if(!r.ok){ $('#payloadStatus').textContent = data.error || 'Payload build failed'; return; }
    lastPayload = data;
    renderSelection(data);
    $('#payloadStatus').textContent = 'Ready to send.';
    setMatchesCollapsed(true);
    return;
  }
  lastPayload = null;
  $('#selectionArea').innerHTML = '<div class="placeholder">Now choose a season and an episode.</div>';
  await loadSeasons(id);
  $('#payloadStatus').textContent = 'Pick a season and episode.';
  setMatchesCollapsed(true);
  setEpisodeCollapsed(false);
  return;
}

async function send(){
  if(!selectedId || !lastPayload) return;
  $('#sendStatus').textContent = 'Sending…';
  let r, data;
  if (lastMode === 'movie') {
    r = await fetch(`/api/send/movie/${selectedId}`, { method:'POST' });
    data = await r.json();
  } else {
    const season = episodeChoice?.season;
    const episode = episodeChoice?.episode;
    if(!season || !episode){ $('#sendStatus').textContent = 'Pick season and episode first.'; return; }
    r = await fetch(`/api/send/episode`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ showId: selectedId, season, episode }) });
    data = await r.json();
  }
  if(!r.ok){ $('#sendStatus').textContent = data.error || 'Send failed'; return; }
  lastPayload = data.payload;
  renderSelection(data.payload);
  renderStatuses(data.sent || []);
  const okCount = (data.sent || []).filter(x => x.ok).length;
  $('#sendStatus').textContent = `${okCount}/${(data.sent || []).length} webhook(s) sent successfully.`;
}

$('#searchBtn').addEventListener('click', search);
$('#matchesToggle').addEventListener('click', () => setMatchesCollapsed(!matchesCollapsed));
$('#episodeToggle').addEventListener('click', () => setEpisodeCollapsed(!episodeCollapsed));
$('#type').addEventListener('change', () => { if($('#q').value.trim()) search(); });
$('#q').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); search(); } });
$('#results').addEventListener('click', e => {
  const card = e.target.closest('[data-id]');
  if(card) buildPayload(card.dataset.id);
});
$('#copyBtn').addEventListener('click', async () => {
  if(!lastPayload) return;
  await navigator.clipboard.writeText(JSON.stringify(lastPayload, null, 2));
  $('#sendStatus').textContent = 'Payload copied to clipboard.';
});
$('#sendBtn').addEventListener('click', send);
search();
</script>
</body>
</html>
